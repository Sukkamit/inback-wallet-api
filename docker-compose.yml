services:
  postgres:
    image: postgres:16-alpine
    container_name: order_tracking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: order_tracking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_tracking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_tracking_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/order_tracking_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: order_tracking_db
      PAYMENT_EXPIRY_MINUTES: 15
      QUEUE_SLA_MINUTES: 10
      DEFAULT_LEASE_SECONDS: 60
      MAX_BOT_RETRIES: 3
      BANK_WEBHOOK_SECRET: bank_webhook_secret_key
    ports:
      - "3000:3000"

volumes:
  postgres_data:
